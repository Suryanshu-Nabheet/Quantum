name: Agent Manager

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "mise.toml"
      - ".github/workflows/agent-manager-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "mise.toml"
      - ".github/workflows/agent-manager-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-manager-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.12

jobs:
  verify:
    name: Format, lint, typecheck, test, and release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Agent Manager dependencies
        run: bun install --frozen-lockfile
        working-directory: agent

      - name: Format check
        run: bun run fmt:check
        working-directory: agent

      - name: Lint
        run: bun run lint
        working-directory: agent

      - name: Typecheck
        run: bun run typecheck
        working-directory: agent

      - name: Test
        run: bun run test
        working-directory: agent

      - name: Release smoke
        run: bun scripts/release-smoke.ts
        working-directory: agent

      - name: Brand check
        run: bun scripts/check-brand-identity.ts
        working-directory: agent

      - name: Migration lineage check
        run: bun scripts/check-migration-lineage.ts
        working-directory: agent
