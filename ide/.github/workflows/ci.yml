name: CI

# Quantum CI — GitHub-hosted runners only (no Microsoft 1ES pools).
on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main, 'release/*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  hygiene:
    name: Compile
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev \
            libxkbfile-dev libsecret-1-dev libkrb5-dev libnotify-bin

      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node build/azure-pipelines/common/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT

      - name: Cache node modules
        id: cacheNodeModules
        uses: actions/cache@v5
        with:
          # Root only — nested agent modules race during npm ci.
          path: 'node_modules'
          key: ${{ runner.os }}-nm21-${{ steps.nodeModulesCacheKey.outputs.value }}
          restore-keys: ${{ runner.os }}-nm21-

      - name: Install dependencies
        if: steps.cacheNodeModules.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3 4 5; do
            npm ci && break
            if [ "$i" -eq 5 ]; then exit 1; fi
            echo "npm ci failed (attempt $i), retrying..."
            sleep 15
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore nested dependencies
        if: steps.cacheNodeModules.outputs.cache-hit == 'true'
        env:
          VSCODE_FORCE_INSTALL: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --experimental-strip-types build/npm/postinstall.ts

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hygiene is intentionally skipped here: Quantum sidebar/status font CSS
      # still trips stylelint (known vars + layer rules). Compile is the gate.
      - name: Compile
        run: npm run compile

      - name: Compile agent
        run: npm run compile-agent
